name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Historical Dataset Integrity
        run: |
          python scripts/validate_historical_data.py

      - name: Initialize Database & Vector Index
        run: |
          python scripts/ingest_historical_data.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests -v

      - name: Run Synthetic Demonstration Scenarios
        run: |
          python scripts/run_demo_scenarios.py

      - name: Run Empirical Validation Benchmark
        run: |
          python scripts/evaluate_agents.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build
