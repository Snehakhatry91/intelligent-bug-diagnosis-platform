# ==============================================================================
# OPTIONAL / FUTURE DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# NOTE: The primary evaluation and demo deployment path for this platform is:
#   - Frontend: Vercel (Static SPA with /api rewrites configured via frontend/vercel.json)
#   - Backend:  Render Web Service (FastAPI + persistent local vector index via render.yaml)
#
# This docker-compose.yml file serves as an optional/future architectural blueprint
# for multi-container orchestration. To run this Compose stack, custom Dockerfiles
# (backend/Dockerfile and frontend/Dockerfile) must be authored. For the evaluation
# prototype, use Render + Vercel or local virtual environment execution.
# ==============================================================================

version: '3.8'

services:
  # Relational Database service (image prepared for relational tables and future pgvector vector indexing)
  # Note: The current evaluation prototype uses the persistent local vector index (rag/vector_index.pkl)
  db:
    image: pgvector/pgvector:pg16
    container_name: bug_diagnosis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bug_diagnosis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bug_diagnosis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bug_diagnosis_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/bug_diagnosis
      - LLM_PROVIDER=fallback
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bug_diagnosis_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
